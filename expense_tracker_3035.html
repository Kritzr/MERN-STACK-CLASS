<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense_Manager by krithiks</title>
    <!-- i have used the font awesome library here to icons for the webpage-->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #e0e7ff;
            --success: #10b981;
            --success-light: #d1fae5;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --neutral: #64748b;
            --neutral-light: #f1f5f9;
            --dark: #334155;
            /*the above arereuable valuesb that can used in the css styling*/
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --border-radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', sans-serif;
            transition: all 0.2s ease;
            /* this transition will apply for all changes*/
        }
        
        body {
            background-color: #f8fafc;
            padding: 20px;
            color: var(--dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 100%);
        }
        
        /* this is the main content card*/
        .container {
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
            background-color: white;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            padding: 30px;
            position: relative;/* allows me to use the top and other space and adjusts itself acordingly*/
            overflow: hidden;/* hides element that goes outside*/
        }
        
        .bg-pattern {
            position: absolute; /*positions with respect to container*/
            top: 0;
            right: 0;
            width: 250px;
            height: 250px;
            background: var(--primary-light);
            border-radius: 0 0 0 100%;
            opacity: 0.2;
            z-index: 0;
        }
        
        .content {
            position: relative;
            z-index: 1;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--neutral-light);
        }
        
        h1 {
            color: var(--primary);
            font-weight: 700;
            font-size: 28px;
            display: flex;
            align-items: center;
        }
        
        h1 i {
            margin-right: 12px;
            background: var(--primary-light);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: var(--primary);
        }
        
        .date-display {
            color: var(--neutral);
            font-size: 14px;
        }
        
        .balance-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .balance-card {
            background: white;
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
            border: 1px solid #eee;
        }
        
        .balance-card.total {
            background: linear-gradient(135deg, var(--primary-light) 0%, white 100%);
            border-color: var(--primary-light);
        }
        
        .balance-card.income {
            background: linear-gradient(135deg, var(--success-light) 0%, white 100%);
            border-color: var(--success-light);
        }
        
        .balance-card.expense {
            background: linear-gradient(135deg, var(--danger-light) 0%, white 100%);
            border-color: var(--danger-light);
        }
        
        .balance-card h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--neutral);
            margin-bottom: 5px;
            display: flex;
            align-items: center;
        }
        
        .balance-card h3 i {
            margin-right: 8px;
            font-size: 16px;
        }
        
        .balance-card.total h3 i {
            color: var(--primary);
        }
        
        .balance-card.income h3 i {
            color: var(--success);
        }
        
        .balance-card.expense h3 i {
            color: var(--danger);
        }
        
        .balance-card p {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .balance-card .balance-icon {
            position: absolute;
            right: 20px;
            bottom: 20px;
            font-size: 36px;
            opacity: 0.1;
        }
        
        .income-amount {
            color: var(--success);
        }
        
        .expense-amount {
            color: var(--danger);
        }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-radius: var(--border-radius);
            background: var(--neutral-light);
            padding: 5px;
            position: relative;
        }
        
        .tab {
            padding: 12px 20px;
            cursor: pointer;
            border-radius: var(--border-radius);
            font-weight: 500;
            text-align: center;
            flex: 1;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .tab i {
            margin-right: 8px;
        }
        
        .tab.active {
            background-color: white;
            box-shadow: var(--shadow);
            color: var(--primary);
        }
        
        .tab-content {
            display: none;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .tab-content.active {
            display: block;
        }
        
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .form-control {
            margin-bottom: 20px;
        }
        
        .form-control label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--dark);
            font-size: 14px;
        }
        
        .form-control input,
        .form-control select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #e2e8f0;
            border-radius: var(--border-radius);
            font-size: 15px;
            background: white;
            color: var(--dark);
        }
        
        .form-control input:focus,
        .form-control select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }
        
        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            border-radius: var(--border-radius);
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 6px rgba(99, 102, 241, 0.25);
        }
        
        .btn i {
            margin-right: 8px;
        }
        
        .btn:hover {
            background-color: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 10px rgba(99, 102, 241, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .transaction-list {
            background: white;
            border-radius: var(--border-radius);
            overflow: hidden;
        }
        
        .transaction-list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .transaction-list h2 {
            font-size: 18px;
            font-weight: 600;
            color: var(--dark);
        }
        
        .transaction-filter {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: var(--neutral);
        }
        
        .transaction-filter select {
            margin-left: 8px;
            padding: 5px;
            border: 1px solid #e2e8f0;
            border-radius: 4px;
            color: var(--dark);
        }
        
        .transaction-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--neutral-light);
            transition: all 0.2s ease;
        }
        
        .transaction-item:hover {
            background-color: var(--neutral-light);
        }
        
        .transaction-item:last-child {
            border-bottom: none;
        }
        
        .transaction-info {
            display: flex;
            align-items: center;
        }
        
        .transaction-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 12px;
            flex-shrink: 0;
        }
        
        .income-icon {
            background-color: var(--success-light);
            color: var(--success);
        }
        
        .expense-icon {
            background-color: var(--danger-light);
            color: var(--danger);
        }
        
        .transaction-details h4 {
            font-size: 15px;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--dark);
        }
        
        .transaction-date {
            font-size: 13px;
            color: var(--neutral);
        }
        
        .transaction-amount {
            font-weight: 600;
            font-size: 16px;
            display: flex;0
            align-items: center;
        }
        
        .delete-btn {
            background-color: transparent;
            color: var(--neutral);
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 15px;
            opacity: 0.5;
            font-size: 14px;
        }
        
        .delete-btn:hover {
            background-color: var(--danger-light);
            color: var(--danger);
            opacity: 1;
        }
        
        .empty-list {
            text-align: center;
            color: var(--neutral);
            padding: 40px 0;
        }
        
        .empty-list i {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.3;
        }
        
        .empty-message {
            font-size: 16px;
            margin-bottom: 5px;
        }
        
        .empty-submessage {
            font-size: 14px;
            opacity: 0.7;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
                margin: 10px;
                width: auto;
            }
            
            .balance-container {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .form-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            
            .transaction-info {
                flex: 1;
                overflow: hidden;
            }
            
            .transaction-details h4 {
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 150px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="bg-pattern"></div>
        <div class="content">
            <header>
                <h1><i class="fas fa-wallet"></i> Expense Manager</h1>
                <div class="date-display" id="current-date"></div>
            </header>
            
            <div class="balance-container">
                <div class="balance-card total">
                    <h3><i class="fas fa-money-bill-wave"></i>Total Balance</h3>
                    <p id="balance">$0.00</p>
                    <i class="fas fa-chart-line balance-icon"></i>
                </div>
                <div class="balance-card income">
                    <h3><i class="fas fa-arrow-down"></i>Income</h3>
                    <p id="income" class="income-amount">$0.00</p>
                    <i class="fas fa-hand-holding-dollar balance-icon"></i>
                </div>
                <div class="balance-card expense">
                    <h3><i class="fas fa-arrow-up"></i>Expense</h3>
                    <p id="expense" class="expense-amount">$0.00</p>
                    <i class="fas fa-receipt balance-icon"></i>
                </div>
            </div>
            
            <div class="tabs">
                <div class="tab active" data-tab="add-transaction">
                    <i class="fas fa-plus-circle"></i>Add Transaction
                </div>
                <div class="tab" data-tab="transaction-list">
                    <i class="fas fa-list"></i>Transaction History
                </div>
            </div>
            
            <div class="tab-content active" id="add-transaction">
                <form id="expense-form">
                    <div class="form-grid">
                        <div class="form-control">
                            <label for="description"><i class="fas fa-tag"></i> Description</label>
                            <input type="text" id="description" placeholder="What was it for?" required>
                        </div>
                        <div class="form-control">
                            <label for="amount"><i class="fas fa-dollar-sign"></i> Amount</label>
                            <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                    </div>
                    <div class="form-grid">
                        <div class="form-control">
                            <label for="type"><i class="fas fa-exchange-alt"></i> Type</label>
                            <select id="type" required>
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>
                        <div class="form-control">
                            <label for="date"><i class="fas fa-calendar"></i> Date</label>
                            <input type="date" id="date" required>
                        </div>
                    </div>
                    <button class="btn" type="submit">
                        <i class="fas fa-plus-circle"></i> Add Transaction
                    </button>
                </form>
            </div>
            
            <div class="tab-content" id="transaction-list">
                <div class="transaction-list">
                    <div class="transaction-list-header">
                        <h2><i class="fas fa-history"></i> Recent Transactions</h2>
                        <div class="transaction-filter">
                            <span>Filter:</span>
                            <select id="filter-transactions">
                                <option value="all">All</option>
                                <option value="income">Income</option>
                                <option value="expense">Expense</option>
                            </select>
                        </div>
                    </div>
                    <div id="transactions-container">
                        <!-- Transactions will be inserted here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize the transactions array from localStorage
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        
        // DOM Elements
        const balanceEl = document.getElementById('balance');
        const incomeEl = document.getElementById('income');
        const expenseEl = document.getElementById('expense');
        const expenseForm = document.getElementById('expense-form');
        const descriptionInput = document.getElementById('description');
        const amountInput = document.getElementById('amount');
        const typeInput = document.getElementById('type');
        const dateInput = document.getElementById('date');
        const transactionsContainer = document.getElementById('transactions-container');
        const tabs = document.querySelectorAll('.tab');
        const tabContents = document.querySelectorAll('.tab-content');
        const filterTransactions = document.getElementById('filter-transactions');
        const currentDateEl = document.getElementById('current-date');
        
        // Set default date to today
        dateInput.valueAsDate = new Date();
        
        // Display current date
        const today = new Date();
        const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
        currentDateEl.textContent = today.toLocaleDateString('en-US', options);
        
        // Add transaction
        function addTransaction(e) {
            e.preventDefault();
            
            // Validate form
            if (descriptionInput.value.trim() === '' || amountInput.value.trim() === '' || dateInput.value === '') {
                alert('Please fill in all fields');
                return;
            }
            
            const transaction = {
                id: generateID(),
                description: descriptionInput.value,
                amount: +amountInput.value,
                type: typeInput.value,
                date: dateInput.value
            };
            
            transactions.push(transaction);
            
            updateLocalStorage();
            updateUI();
            
            // Reset form
            expenseForm.reset();
            dateInput.valueAsDate = new Date();
            
            // Show success indication
            const submitBtn = document.querySelector('.btn[type="submit"]');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Added Successfully';
            submitBtn.style.backgroundColor = '#10b981';
            
            setTimeout(() => {
                submitBtn.innerHTML = originalText;
                submitBtn.style.backgroundColor = '';
            }, 2000);
        }
        
        // Generate random ID
        function generateID() {
            return Math.floor(Math.random() * 1000000000);
        }
        
        // Delete transaction
        function deleteTransaction(id) {
            transactions = transactions.filter(transaction => transaction.id !== id);
            
            updateLocalStorage();
            updateUI();
        }
        
        // Update local storage
        function updateLocalStorage() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }
        
        // Update UI
        function updateUI() {
            // Update balance, income and expense
            updateBalance();
            
            // Update transaction list
            updateTransactionList();
        }
        
        // Update balance, income and expense
        function updateBalance() {
            const amounts = transactions.map(transaction => transaction.amount);
            
            const totalIncome = transactions
                .filter(transaction => transaction.type === 'income')
                .reduce((acc, transaction) => acc + transaction.amount, 0);
            
            const totalExpense = transactions
                .filter(transaction => transaction.type === 'expense')
                .reduce((acc, transaction) => acc + transaction.amount, 0);
            
            const total = totalIncome - totalExpense;
            
            balanceEl.textContent = `$${total.toFixed(2)}`;
            incomeEl.textContent = `$${totalIncome.toFixed(2)}`;
            expenseEl.textContent = `$${totalExpense.toFixed(2)}`;
        }
        
        // Update transaction list
        function updateTransactionList() {
            // Get current filter value
            const filterValue = filterTransactions.value;
            
            // Filter transactions based on selected filter
            let filteredTransactions = [...transactions];
            if (filterValue !== 'all') {
                filteredTransactions = transactions.filter(transaction => transaction.type === filterValue);
            }
            
            // Sort transactions by date (newest first)
            const sortedTransactions = filteredTransactions.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            // Clear transaction list
            transactionsContainer.innerHTML = '';
            
            if (sortedTransactions.length === 0) {
                transactionsContainer.innerHTML = `
                    <div class="empty-list">
                        <i class="fas fa-inbox"></i>
                        <div class="empty-message">No transactions found</div>
                        <div class="empty-submessage">Add a new transaction to get started</div>
                    </div>
                `;
                return;
            }
            
            // Add transactions to DOM
            sortedTransactions.forEach(transaction => {
                const formattedDate = new Date(transaction.date).toLocaleDateString();
                const sign = transaction.type === 'expense' ? '-' : '+';
                const typeClass = transaction.type === 'expense' ? 'expense' : 'income';
                const iconClass = transaction.type === 'expense' ? 'fas fa-shopping-cart' : 'fas fa-credit-card';
                
                const transactionEl = document.createElement('div');
                transactionEl.classList.add('transaction-item');
                
                transactionEl.innerHTML = `
                    <div class="transaction-info">
                        <div class="transaction-icon ${typeClass}-icon">
                            <i class="${iconClass}"></i>
                        </div>
                        <div class="transaction-details">
                            <h4>${transaction.description}</h4>
                            <div class="transaction-date">${formattedDate}</div>
                        </div>
                    </div>
                    <div style="display: flex; align-items: center;">
                        <span class="transaction-amount ${typeClass}">${sign}$${transaction.amount.toFixed(2)}</span>
                        <button class="delete-btn" onclick="deleteTransaction(${transaction.id})">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                `;
                
                transactionsContainer.appendChild(transactionEl);
            });
        }
        
        // Event listeners
        expenseForm.addEventListener('submit', addTransaction);
        
        // Tab functionality
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and content
                tabs.forEach(t => t.classList.remove('active'));
                tabContents.forEach(c => c.classList.remove('active'));
                
                // Add active class to current tab and content
                tab.classList.add('active');
                const tabId = tab.getAttribute('data-tab');
                document.getElementById(tabId).classList.add('active');
            });
        });
        
        // Filter transactions
        filterTransactions.addEventListener('change', updateTransactionList);
        
        // Initial render
        updateUI();
    </script>
</body>
</html>
